name = "seat-airlines-banners"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[kv_namespaces]]
binding = "BANNERS"
id = "local-test"

# Miniflare's own SQLite. The id never reaches Cloudflare; apply the schema to
# it with:
#   npx wrangler d1 migrations apply seat-airlines-directory --local --config wrangler.local.toml
[[d1_databases]]
binding = "DIRECTORY"
database_name = "seat-airlines-directory"
database_id = "local-test"

[vars]
ALLOWED_ORIGINS = "http://localhost:3000"

# The e2e suite serves its own holder list here and seats the wallets it just
# generated, which is how the section rules can be exercised at all: the
# Worker has to believe somebody is on the flight deck and somebody else is in
# business. A second of cache rather than the default minute, so a run is not
# reading the seating from the run before it.
HOLDERS_URL = "http://127.0.0.1:8788/holders"
LADDER_CACHE_MS = "1000"

# The same server answers JSON-RPC, so the suite can decide who holds the
# token and change its mind mid-run. Without this the holder check stands
# aside — it has nothing to ask — and a wallet that sells its bag looks
# exactly like one that has not.
#
# The mint is never dereferenced by the fake chain; it only has to be set,
# because "no mint" is what tells the Worker there is no token to check
# against yet.
TOKEN_MINT = "TestMint111111111111111111111111111111111111"
RPC_URL = "http://127.0.0.1:8788/rpc"
# A fifth of a second rather than the default 45, so watching a holder stop
# being one does not mean sitting through three quarters of a minute.
OWNER_CACHE_MS = "200"
