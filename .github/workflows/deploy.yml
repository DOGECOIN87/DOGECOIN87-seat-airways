name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The documentation is published by GitBook, not by this workflow, and
    # GitBook commits every edit made there back to this branch. A push that
    # touches nothing but the docs has nothing here to rebuild; one that
    # touches anything else still deploys.
    paths-ignore:
      - 'docs/**'
      - '.gitbook.yaml'
  # So a config change can be shipped without an empty commit.
  workflow_dispatch:

# Pages deployments need an OIDC token; nothing here needs write access to
# the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-uploaded, but
# never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The publish path reaches a wallet signature, so a failure there costs
      # somebody a signing prompt for an upload that was never going to land.
      - run: npm test

      # ── Configuration ──────────────────────────────────────────────────
      # These are repository *variables*, not secrets, and that is not an
      # oversight. Vite inlines every VITE_-prefixed value into the bundle it
      # ships, so all of them are readable by anyone who opens the site and
      # looks. Storing one as a secret would hide it from the repository and
      # from nobody else.
      #
      # Which is why VITE_RPC_URL should be left UNSET on a deployment that
      # has a Worker. A paid RPC endpoint carries its API key in the URL, and
      # setting this publishes that key to everyone who opens the site. The
      # protection on offer is to restrict the key by domain at the provider,
      # and that restriction is the Origin header — a string anybody with curl
      # can type. It stops a copy-paste, not a script.
      #
      # The Worker holds the endpoint as a real secret and answers /holding
      # and /holders, which is where the page reads both from by default. This
      # variable is the fallback for a deployment with no Worker at all; set
      # it only if that is what you are running.
      - run: npm run build
        env:
          VITE_TOKEN_MINT: ${{ vars.VITE_TOKEN_MINT }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_HOLDERS_URL: ${{ vars.VITE_HOLDERS_URL }}
          VITE_MARKET_URL: ${{ vars.VITE_MARKET_URL }}
          VITE_BANNERS_API: ${{ vars.VITE_BANNERS_API }}
          VITE_BANNERS_URL: ${{ vars.VITE_BANNERS_URL }}
          VITE_DIRECTORY_API: ${{ vars.VITE_DIRECTORY_API }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
